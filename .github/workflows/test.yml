name: Full test suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and real package builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHON: python3
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - name: Select the recorded npm version
        run: npm install --global npm@12.2.3 --ignore-scripts --no-audit --no-fund
      - name: Install exactly the locked dependencies
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Show the execution environment
        run: |
          node --version
          npm --version
          python3 --version
      - name: Run every suite and real package build
        run: npm test
      - name: Ensure tests did not edit tracked sources or the lockfile
        run: git diff --exit-code

schema_version: '0.1'
project:
  name: Persian Journalism Skills for AI
  repository: https://github.com/alirezach/Persian-Journalism-skills-for-AI
  release: '0.4.3-editing'
  lifecycle: editing-experimental
  default_language: fa
  license: MIT
  updated: '2026-11-15'
  note: 'Persian editing 0.1.3 and humanities translation 0.1.0 are experimental; six other skills remain planned. Translation was explicitly promoted by project-owner decision without new test suites, model evaluation or installation. The project release identifier remains 0.4.3-editing; no new GitHub Release or tag was created. Earlier editing evidence remains separate and does not transfer to translation.'

lifecycle_values:
  planned: 'Not designated for experimental release; design, source guidance or a preparation-stage candidate archive may exist. Packaging does not promote lifecycle status.'
  experimental: 'Explicitly designated experimental package; acceptance and compatibility evidence remain incomplete.'
  tested: 'Named acceptance cases pass in recorded environments; not a universal guarantee.'
  deprecated: 'Retained for migration; replacement and reason documented.'


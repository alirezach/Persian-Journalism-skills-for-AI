schema_version: '0.1'
project:
  name: Persian Journalism Skills for AI
  repository: https://github.com/alirezach/Persian-Journalism-skills-for-AI
  release: '0.4.0-editing'
  lifecycle: editing-experimental
  default_language: fa
  license: MIT
  updated: '2026-11-13'
  note: 'Persian editing 0.1.0 has source instructions and a standalone package builder. Seven skills remain planned; model behavior and host compatibility are not tested.'

lifecycle_values:
  planned: 'Design recorded; package does not yet exist.'
  experimental: 'Package exists; acceptance and compatibility evidence remain incomplete.'
  tested: 'Named acceptance cases pass in recorded environments; not a universal guarantee.'
  deprecated: 'Retained for migration; replacement and reason documented.'

capability_levels:
  - text-guidance
  - local-files-and-code
  - connected-services

shared_layers:
  standards: standards/
  iran_context: contexts/iran/
  locale_profiles: profiles/locales/
  house_style_profiles: profiles/house-style/
  versioned_knowledge: knowledge/
  schemas: schemas/

contracts:
  schema_version: '0.1.0'
  dialect: draft-07
  status: experimental
  record_types: [source, claim, dataset, finding, handoff]
  definitions: schemas/common.schema.json
  guide: schemas/README.md
  tests: tests/schemas.test.cjs
  local_checks_passed: 67
  local_checks_failed: 0
  tested_with:
    node: v22.23.1
    ajv: '6.15.0'
  not_tested: [network-install, ci, model-behavior, real-world-evidence]

profiles:
  status: experimental
  version: '0.1.0'
  locale: profiles/locales/fa-IR.yaml
  house_style: profiles/house-style/default-fa.yaml
  guide: profiles/README.md
  automatic_iran_context: false
  automatic_rewriting: false
  automatic_merge: false

templates:
  status: experimental
  guide: templates/README.md
  count: 8
  serialization: human-working-forms-not-canonical-json
  automatic_csv_conversion: false

record_validator:
  status: experimental
  version: '0.3.0-tooling'
  cli: scripts/validation/validate-records.cjs
  library: scripts/validation/records.cjs
  guide: scripts/validation/README.md
  example: examples/records/synthetic-bundle.json
  supported_schema_version: '0.1.0'
  default_references: strict-in-bundle-versioned
  external_reference_mode: explicit-warning-with-incomplete-relationships
  network_fetches: false
  modifies_input: false
  follows_declared_file_references: false
  cli_limits:
    bytes: 2097152
    depth: 64
    records: 1000
    displayed_issues: 100
  not_verified: [factual-accuracy, analysis-method, publication-authority, privacy-safety, real-inspection, model-behavior]

local_test_run:
  date: '2026-11-13'
  passed: 231
  failed: 0
  suites:
    schema_and_regression: 67
    validator_and_cli: 88
    profiles_and_templates: 23
    editing_static_contracts: 16
    editing_packager: 37
  tested_with:
    node: v22.23.1
    ajv: '6.15.0'
    js_yaml: '4.3.2'
    python: '3.12.13'
  dependency_source: preinstalled
  complete_dependency_lock: false
  not_run: [network-install, npm-commands, ci, model-behavior, visual-rendering, full-security-audit, cross-platform-matrix]

skills:
  - name: persian-editing
    title_fa: ویرایش فارسی
    status: experimental
    version: '0.1.0'
    path: skills/persian-editing/SKILL.md
    intended_entry: false
    build_manifest: skills/persian-editing/build-manifest.json
    evaluation: docs/evaluations/persian-editing-0.1.0.md
    model_behavior: not_run
    host_compatibility: untested
    purpose: 'Edit Persian at the requested intervention level while preserving meaning and evidence.'
    collaborators: []
    context_policy: 'Persian locale; Iran context only when substantive content requires it.'
  - name: humanities-translation
    title_fa: ترجمهٔ علوم انسانی
    status: planned
    path: skills/humanities-translation/SKILL.md
    intended_entry: true
    purpose: 'Translate humanities and policy texts with source fidelity and consistent terminology.'
    collaborators: [persian-editing]
    context_policy: 'Choose terminology by field and tradition; do not assume Iran from output language.'
  - name: source-verification
    title_fa: اعتبارسنجی منبع
    status: planned
    path: skills/source-verification/SKILL.md
    intended_entry: true
    purpose: 'Assess identity, provenance, authenticity, context and limits of supplied evidence.'
    collaborators: []
    context_policy: 'Activate jurisdiction and geography only when relevant to the item.'
  - name: fact-checking
    title_fa: راستی‌آزمایی ادعا
    status: planned
    path: skills/fact-checking/SKILL.md
    intended_entry: true
    purpose: 'Investigate scoped factual claims and document evidence-based assessments.'
    collaborators: [source-verification, data-analysis]
    context_policy: 'Load legal, statistical and geographic context according to claim scope.'
  - name: research-synthesis
    title_fa: ترکیب پژوهش
    status: planned
    path: skills/research-synthesis/SKILL.md
    intended_entry: true
    purpose: 'Answer bounded research questions through transparent selection and comparison of evidence.'
    collaborators: [source-verification, fact-checking]
    context_policy: 'Choose sources and context by research question, not language alone.'
  - name: data-analysis
    title_fa: تحلیل داده
    status: planned
    path: skills/data-analysis/SKILL.md
    intended_entry: true
    purpose: 'Validate, transform and analyze data with reproducible calculations and explicit limitations.'
    collaborators: [source-verification]
    context_policy: 'Apply dataset-specific units, calendars, populations and survey definitions.'
  - name: data-visualization
    title_fa: بصری‌سازی داده
    status: planned
    path: skills/data-visualization/SKILL.md
    intended_entry: true
    purpose: 'Create honest, accessible charts, maps and tables from identified data and definitions.'
    collaborators: [data-analysis]
    context_policy: 'Keep locale rendering distinct from geographic and analytical semantics.'
  - name: data-journalism
    title_fa: دیتاژورنالیسم
    status: planned
    path: skills/data-journalism/SKILL.md
    intended_entry: true
    purpose: 'Coordinate a reporting question through evidence, analysis, reporting and publication review.'
    collaborators: [source-verification, fact-checking, research-synthesis, data-analysis, data-visualization, persian-editing]
    context_policy: 'Load only relevant branches; a file inspection does not imply a full story.'

packaging_policy:
  collaborators_are_mandatory_installs: false
  standalone_packages_required: true
  fallback: 'If specialist capability is unavailable, report the limitation and do not claim its checks ran.'
  generated_distributions: true
  compatibility_status: untested
